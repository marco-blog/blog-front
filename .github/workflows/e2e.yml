name: E2E (nightly)

# 전체 Playwright E2E(T245): backend main + 일회용 MySQL + Mailpit과 함께 메일 시나리오까지 모두 돌린다.
# PR마다 도는 ci.yml(e2e-backend)과 같은 구성에 Mailpit(MAILPIT_URL)을 더했다. 수동 실행과 매일 밤 실행.
on:
  workflow_dispatch:
    inputs:
      backend-ref:
        description: "blog-backend 브랜치·태그·커밋"
        required: false
        default: main
  schedule:
    # 매일 03:00 KST(18:00 UTC)
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 비밀 값은 실행마다 새로 만드는 일회용 값이고, MySQL 비밀번호는 작업이 끝나면 사라지는 컨테이너용 고정값이다.
    env:
      MYSQL_ROOT_PASSWORD: ci-only-root-pw
      # 관리자 시나리오(portal-us4·us5)용 CI 전용 일회용 계정. 일회용 MySQL에만 만들어지고 작업이 끝나면 사라진다.
      E2E_ADMIN_EMAIL: e2e-admin@example.test
      E2E_ADMIN_PASSWORD: ci-only-admin-pw-1234

    services:
      # 개발용 메일 서버. backend local 프로필의 기본 메일 설정(localhost:1025, 인증·STARTTLS 없음)이 여기로 보낸다.
      # E2E는 웹 API(MAILPIT_URL=http://localhost:8025)로 받은 메일을 읽는다.
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: marco-blog/blog-backend
          ref: ${{ inputs.backend-ref || 'main' }}
          path: blog-backend

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: blog-backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # services: 는 컨테이너 실행 인자를 줄 수 없어서(--ngram-token-size=2) docker run으로 띄운다.
      - name: Start MySQL 8.4 and load schema
        run: |
          docker run -d --name blog-mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            -e MYSQL_DATABASE=blog_e2e \
            mysql:8.4 --ngram-token-size=2
          # 초기화용 임시 서버는 TCP를 열지 않으므로 TCP 접속이 되면 실제 서버가 뜬 것이다.
          for i in $(seq 1 60); do
            if docker exec blog-mysql mysql -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec -i blog-mysql mysql -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" blog_e2e \
            < blog-backend/src/test/resources/db/schema-mysql.sql

      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8025/api/v1/info >/dev/null; then
              echo "Mailpit is ready"; exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Build backend
        working-directory: blog-backend
        run: ./mvnw -B -q -DskipTests package

      # local 프로필: 허용 Origin에 http://localhost:5173(Playwright가 띄우는 front)이 있고,
      # 메일 링크 주소(blog.base-url)도 http://localhost:5173이다.
      - name: Start backend
        working-directory: blog-backend
        env:
          SPRING_PROFILES_ACTIVE: local
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/blog_e2e?connectionTimeZone=UTC&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ci-only-root-pw
          DB_PASSWORD: unused
          # 포털 시험용 운영 설정(E2E_PORTAL_TEST_SETTINGS=1과 짝): 캐시 끔, 가입 직후 노출, 주제 탭은 글 1편부터
          BLOG_PORTAL_CACHE_TTL: 0s
          BLOG_PORTAL_NEW_MEMBER_DELAY: PT0S
          BLOG_PORTAL_TOPIC_AUTO_HIDE_THRESHOLD: "1"
          # 005 스팸 방어 시험용 설정(E2E_GUEST_TEST_SETTINGS=1·E2E_MODERATION_TEST_SETTINGS=1과 짝). 모든 시나리오가 같은
          # IP(localhost)에서 가입·댓글·방명록·발행·업로드·신고를 하므로 한도를 넉넉히 둔다. 특히 가입 IP 한도(기본 1시간 5회)가
          # 없으면 001~004 E2E가 가입 단계에서 막힌다(005 research M18). CAPTCHA는 test(토큰 e2e-pass, front 기본값과 같음).
          # 004의 BLOG_GUEST_COMMENT_PER_MINUTE·BLOG_GUEST_GUESTBOOK_PER_MINUTE는 005의 blog.ratelimit.*로 옮겨 없어졌다.
          BLOG_CAPTCHA_PROVIDER: test
          # 로그인 CAPTCHA 기준(같은 이메일·같은 IP 연속 3회 실패)은 모든 시나리오가 같은 IP라 001의 잠금·오류 문구 시나리오를
          # 서로 막는다. E2E에서는 넉넉히 두고 기준 동작은 backend 시험(LoginCaptchaPolicyTest·LoginServiceTest)과 front 단위 시험이 본다.
          BLOG_CAPTCHA_LOGIN_FAILURES_BEFORE_CAPTCHA: "100000"
          BLOG_RATELIMIT_SIGNUP_PER_IP_PER_HOUR: "100000"
          BLOG_RATELIMIT_COMMENT_PER_MINUTE: "1000"
          BLOG_RATELIMIT_GUESTBOOK_PER_MINUTE: "1000"
          BLOG_RATELIMIT_POST_PUBLISH_PER_HOUR: "100000"
          BLOG_RATELIMIT_MEDIA_UPLOAD_PER_MINUTE: "1000"
          BLOG_TRACKBACK_RECEIVE_LIMIT: "100000"
          BLOG_REPORTS_MEMBER_PER_HOUR: "100000"
          BLOG_REPORTS_RIGHTS_REQUEST_PER_IP_PER_HOUR: "100000"
          # 004 블로그 백업 zip 디렉터리(blog-us4-backup E2E). 실행마다 비는 러너 임시 디렉터리
          BLOG_EXPORT_DIR: ${{ runner.temp }}/blog-exports
          BLOG_MAIL_HOST: localhost
          BLOG_MAIL_PORT: "1025"
          BLOG_MAIL_STARTTLS: "false"
          BLOG_MAIL_FROM: no-reply@localhost
          BLOG_BASE_URL: http://localhost:5173
          BLOG_MEDIA_UPLOAD_DIR: ${{ runner.temp }}/blog-media/upload
          BLOG_MEDIA_TEMP_DIR: ${{ runner.temp }}/blog-media/temp
          BLOG_MEDIA_THUMBNAIL_DIR: ${{ runner.temp }}/blog-media/thumb
          # 006 대시보드 수치를 바로 확인(E2E_ADMIN_TEST_SETTINGS=1과 짝): 대시보드 캐시 끔
          BLOG_ADMIN_DASHBOARD_CACHE_TTL: 0s
        run: |
          BLOG_CRYPTO_KEY_V1="$(openssl rand -base64 32)"
          BLOG_CRYPTO_HASH_KEY="$(openssl rand -base64 32)"
          BLOG_AUTH_JWT_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::$BLOG_CRYPTO_KEY_V1"
          echo "::add-mask::$BLOG_CRYPTO_HASH_KEY"
          echo "::add-mask::$BLOG_AUTH_JWT_SECRET"
          export BLOG_CRYPTO_KEY_V1 BLOG_CRYPTO_HASH_KEY BLOG_AUTH_JWT_SECRET
          nohup java -jar target/blog-backend-*.jar --spring.jpa.show-sql=false > backend.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fs http://localhost:8080/actuator/health >/dev/null; then
              echo "backend is up"; exit 0
            fi
            sleep 2
          done
          cat backend.log
          exit 1

      # 가입 API로 관리자 계정을 만들고 일회용 MySQL에서 role을 SUPER_ADMIN으로 바꾼다(scripts/e2e-provision-admin.sh).
      - name: Provision E2E admin
        run: ./scripts/e2e-provision-admin.sh
        env:
          E2E_BACKEND_URL: http://localhost:8080
          MYSQL_CONTAINER: blog-mysql
          MYSQL_DATABASE: blog_e2e

      - run: npm ci

      - name: Build front
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts의 webServer가 front를 빌드해 http://localhost:5173으로 띄우고 BLOG_BACKEND_URL을 넘긴다.
      - name: E2E (all scenarios, with mail)
        run: npx playwright test
        env:
          CI: "true"
          E2E_BACKEND_URL: http://localhost:8080
          MAILPIT_URL: http://localhost:8025
          E2E_PORTAL_TEST_SETTINGS: "1"
          E2E_GUEST_TEST_SETTINGS: "1"
          # 005 신고·스팸 방어·트랙백 시나리오(moderation 프로젝트): 위 backend 한도·CAPTCHA test로 띄웠다는 표시
          E2E_MODERATION_TEST_SETTINGS: "1"
          # 006 관리 콘솔 시나리오(admin 프로젝트): 위 BLOG_ADMIN_DASHBOARD_CACHE_TTL=0s로 띄웠다는 표시
          E2E_ADMIN_TEST_SETTINGS: "1"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nightly-logs
          path: |
            blog-backend/backend.log
            test-results/
          retention-days: 7
          if-no-files-found: ignore
