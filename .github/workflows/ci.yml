name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # package.json engines(>=22.18)와 의존성(jsdom 등)의 요구를 함께 만족하는 LTS
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # 커버리지는 vitest.config.ts에서 켜져 있고, 라인 80% 미만이면 실패한다(헌법 원칙 III).
      # 번역 누락 점검(tests/unit/i18n/translations.test.ts)도 여기 포함된다.
      - name: Test (coverage)
        run: npm test -- --coverage

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      # 빌드 산출물로 서버를 띄워 SSR·404·보안 헤더(CSP nonce)를 확인한다. backend 없이 도는 시나리오만 있다.
      - name: E2E (smoke)
        run: npx playwright test
        env:
          CI: "true"

  # US1 E2E(tests/e2e/us1-*): backend main을 받아 일회용 MySQL과 함께 띄우고 front 빌드 산출물로 시나리오를 돌린다.
  # 비밀 값은 실행마다 새로 만드는 일회용 값이고, MySQL 비밀번호는 작업이 끝나면 사라지는 컨테이너용 고정값이다.
  e2e-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MYSQL_ROOT_PASSWORD: ci-only-root-pw
    steps:
      - uses: actions/checkout@v4

      - name: Checkout backend (main)
        uses: actions/checkout@v4
        with:
          repository: marco-blog/blog-backend
          ref: main
          path: blog-backend

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: blog-backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # services: 는 컨테이너 실행 인자를 줄 수 없어서(--ngram-token-size=2) docker run으로 띄운다.
      - name: Start MySQL 8.4 and load schema
        run: |
          docker run -d --name blog-mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            -e MYSQL_DATABASE=blog_e2e \
            mysql:8.4 --ngram-token-size=2
          for i in $(seq 1 60); do
            if docker exec blog-mysql mysql -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec -i blog-mysql mysql -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" blog_e2e \
            < blog-backend/src/test/resources/db/schema-mysql.sql

      - name: Build backend
        working-directory: blog-backend
        run: ./mvnw -B -q -DskipTests package

      - name: Start backend
        working-directory: blog-backend
        env:
          SPRING_PROFILES_ACTIVE: local
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/blog_e2e?connectionTimeZone=UTC&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ci-only-root-pw
          DB_PASSWORD: unused
        run: |
          BLOG_CRYPTO_KEY_V1="$(openssl rand -base64 32)"
          BLOG_CRYPTO_HASH_KEY="$(openssl rand -base64 32)"
          BLOG_AUTH_JWT_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::$BLOG_CRYPTO_KEY_V1"
          echo "::add-mask::$BLOG_CRYPTO_HASH_KEY"
          echo "::add-mask::$BLOG_AUTH_JWT_SECRET"
          export BLOG_CRYPTO_KEY_V1 BLOG_CRYPTO_HASH_KEY BLOG_AUTH_JWT_SECRET
          nohup java -jar target/blog-backend-*.jar --spring.jpa.show-sql=false > backend.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fs http://localhost:8080/actuator/health >/dev/null; then
              echo "backend is up"; exit 0
            fi
            sleep 2
          done
          cat backend.log
          exit 1

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (US1 with backend)
        run: npx playwright test
        env:
          CI: "true"
          E2E_BACKEND_URL: http://localhost:8080

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-logs
          path: |
            blog-backend/backend.log
            test-results/
          retention-days: 7
          if-no-files-found: ignore
